[package]
name = "cylon-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Node.js native addon for Cylon distributed operations via napi-rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["fmi"]
# Communication backends - enable based on available system libraries
fmi = ["cylon/fmi", "cylon/redis", "cylon/s3"]
mpi = ["cylon/mpi"]
ucx = ["cylon/ucx"]
ucc = ["cylon/ucc"]
libfabric = ["cylon/libfabric"]
gloo = ["cylon/gloo"]

[dependencies]
# napi-rs for Node.js native addon
napi = { version = "2", features = ["async", "napi8"] }
napi-derive = "2"

# Logging — use cylon's init_logging() which sets WriteStyle::Never for CloudWatch
log = "0.4"

# Use the main cylon crate
cylon = { path = ".." }

# Arrow for data handling (match main cylon crate version)
arrow = { version = "57.1.0", default-features = false }

# Async runtime for FMI operations
tokio = { version = "1", features = ["rt", "sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true