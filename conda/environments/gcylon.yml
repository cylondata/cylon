name: gcylon_dev
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.9,<3.12
  - cmake
  - pyarrow=16.1.0
  - libarrow-acero==16.1.0.*
  - libarrow-dataset==16.1.0.*
  - libarrow==16.1.0.*
  - cython>=0.29.31
  - cudf=24.10
  - libcudf=24.10
  - rmm=24.10
  - librmm=24.10
  - cuda-version=12.4
  - glog
  - openmpi
  - ucx
  - pip
  - numpy>=1.23,<2.0a0
  - pandas>=2.0,<2.2.3dev
  - fsspec>=0.6.0
  - setuptools
  # these are for running tests only,
  # they are not needed for using pygcylon or compiling it
  - pytest
  - pytest-mpi
  - mpi4py
